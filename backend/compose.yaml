name: recall-corp-backend

# Mirror of the upstream RELEASE.2025-09-07T16-13-09Z image, which includes mc.
x-minio-image: &minio-image ghcr.io/datalens-tech/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e

networks:
  dev:

services:
  backend:
    container_name: recall-corp-backend
    build: .
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dev
  minio-setup:
    container_name: recall-corp-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    image: *minio-image
    env_file:
      - ./config/minio-server.env
      - ./config/minio-backend.env
    environment:
      - "MINIO_SERVER_HOSTNAME=http://minio:9000"
    volumes:
      - recall-corp-minio-volume:/mnt/minio-volume
      - ./config/minio-setup.sh:/setup.sh
    entrypoint: bash /setup.sh
    restart: on-failure
    networks:
      - dev
  minio:
    container_name: recall-corp-minio
    image: *minio-image
    environment:
      - MINIO_CONFIG_ENV_FILE=/etc/config.env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - recall-corp-minio-volume:/mnt/minio-volume
      - ./config/minio-server.env:/etc/config.env
    command: server --console-address ":9001"
    healthcheck:
      test: "curl -f http://localhost:9000/minio/health/live"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - dev
  postgres:
    image: postgres:17.0-alpine
    container_name: recall-corp-postgres
    env_file: ./config/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - recall-corp-pgdata-volume:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 3s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: always
    networks:
      - dev

volumes:
  recall-corp-minio-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $MINIO_VOLUME_PATH
  recall-corp-pgdata-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $POSTGRES_VOLUME_PATH
